# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# The Sphinx project lives in docs/source (conf.py, *.rst, requirements.txt).
# funcsim itself is imported from the repository checkout via the sys.path
# entries in docs/source/conf.py, so it does not need to be installed here.
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/source/requirements.txt
